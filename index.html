<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BIO-BREACH HUB</title>

    <meta name="application-name" content="BB Hub">
    <meta name="description" content="Launcher oficial de BIO-BREACH. Gestiona, descarga y juega versiones exclusivas del sistema de rastreo.">
    <meta name="theme-color" content="#ffd700">
    <link rel="canonical" href="https://elfaraon65.github.io/bio-breach-repositorio/" />
    
    <link rel="icon" type="image/png" href="./Logo%20BIO-BREACH.png">
    <link rel="apple-touch-icon" href="./Logo%20BIO-BREACH.png">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BB Hub">
    <meta name="format-detection" content="telephone=no">

    <meta property="og:type" content="website">
    <meta property="og:title" content="BIO-BREACH HUB">
    <meta property="og:description" content="Accede al sistema de rastreo y gestiona versiones.">
    <meta property="og:image" content="./Logo%20BIO-BREACH.png">
    <meta property="og:url" content="https://elfaraon65.github.io/bio-breach-repositorio/">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="BIO-BREACH HUB">
    <meta name="twitter:description" content="Launcher oficial de BIO-BREACH.">
    <meta name="twitter:image" content="./Logo%20BIO-BREACH.png">

    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; 
                   script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; 
                   style-src 'self' 'unsafe-inline' https:; 
                   img-src 'self' data: https: blob:; 
                   connect-src 'self' https: wss: blob: data:; 
                   frame-src 'self' blob: data: https:;">

    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=(), usb=(), vr=(), accelerometer=(), gyroscope=(), magnetometer=()">

    <link rel="manifest" href="./manifest.json?v=tabs_fix">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-messaging-compat.js"></script>

    <style>
        :root { --gold: #ffd700; --bg: #0a0a0a; --card: #161616; --blue: #0078d4; --green: #00ff41; --orange: #ff8c00; --red: #ff0040; --tab-active: #222; }
        
        html { height: 100%; overscroll-behavior: none; }
        body { 
            background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 0; user-select: none; min-height: 100%;
            overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; 
        }
        
        .header { background: #000; padding: 15px; text-align: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10; }
        .header h1 { margin: 0; font-size: 1.2rem; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; }
        #status-bar { font-size: 0.65rem; color: var(--orange); text-transform: uppercase; margin-top: 5px; letter-spacing: 1px; }

        /* --- SISTEMA DE PESTAÑAS --- */
        .tabs { display: flex; background: #111; border-bottom: 2px solid var(--gold); position: sticky; top: 60px; z-index: 9; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .tab { flex: 1; padding: 15px; text-align: center; font-weight: bold; font-size: 0.9rem; color: #888; cursor: pointer; text-transform: uppercase; transition: 0.2s; position: relative; }
        .tab.active { color: white; background: var(--tab-active); }
        .tab.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--gold); }
        
        .badge { background: var(--red); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; position: absolute; top: 10px; right: 10px; display: none; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Contenedores de Vistas */
        .view-section { display: none; padding: 15px; padding-bottom: 100px; animation: fadeIn 0.3s; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .project-card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid #333; display: flex; flex-direction: column; gap: 12px; transition: 0.3s; position: relative; }
        
        .v-name { font-size: 1.2rem; font-weight: bold; color: #fff; }
        .v-status { font-size: 0.8rem; color: #888; display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
        .dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .dot.offline { background: var(--orange); }

        .progress-container { width: 100%; background: #333; height: 10px; border-radius: 5px; overflow: hidden; display: none; margin-top: 10px; }
        .progress-bar { width: 0%; height: 100%; background: var(--blue); transition: width 0.1s; }

        .btn { border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; text-align: center; transition: 0.2s; margin-top: 5px; color: white; width: 100%; }
        .btn-play { background: var(--green); }
        .btn-download { background: var(--blue); }
        
        .btn-update { background: transparent; border: 2px solid var(--gold); color: var(--gold); margin-top: 5px; }
        .btn-update:active { background: var(--gold); color: black; }

        .empty-msg { text-align: center; padding: 40px; color: #666; font-size: 0.9rem; border: 1px dashed #333; border-radius: 10px; margin-top: 20px; }

        #game-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; overscroll-behavior: none; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>

    <div class="header">
        <h1>BIO-BREACH HUB</h1>
        <div id="status-bar">MODO LOCAL</div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('library')">
            BIBLIOTECA
        </div>
        <div class="tab" onclick="switchTab('updates')">
            CENTRO DE DATOS
            <span id="update-badge" class="badge">0</span>
        </div>
    </div>

    <div id="view-library" class="view-section active">
        <div id="lista-versiones"></div>
    </div>

    <div id="view-updates" class="view-section">
        <div style="font-size:0.8rem; color:#888; text-transform:uppercase; border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:15px;">
            Cola de descargas
        </div>
        <div id="pending-section"></div>
    </div>

    <div id="game-view">
        <iframe id="game-frame"></iframe>
    </div>

    <script>
        // --- GESTIÓN DE PWA / INSTALACIÓN ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js?v=" + new Date().getTime(), { scope: "/" })
                .then(async reg => {
                    console.log("SW Registrado.");
                    if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });        
                    
                    // NUEVA LÍNEA: INICIAR FIREBASE
                    initFirebase(reg); 
                })
                .catch(err => console.error("SW Error:", err));
        }
        
                // --- FUNCIÓN DE INICIO DE FIREBASE ---
        function initFirebase(registration) {
            // REEMPLAZA ESTOS DATOS CON LOS DE TU CONSOLA FIREBASE
            const firebaseConfig = {
                apiKey: "AIzaSyBmn_I9e9RWS6nwk95o-MYR45DTepe3Gzw",
                authDomain: "bio-breach-game.firebaseapp.com",
                projectId: "bio-breach-game",
                storageBucket: "bio-breach-game.firebasestorage.app",
                messagingSenderId: "446020506947",
                appId: "1:446020506947:web:27e1b80ca7e8713b788bf6"
            };

            // REEMPLAZA CON TU CLAVE VAPID (Par de claves generado en Cloud Messaging)
            const VAPID_KEY = "BEgDtcKbdKa9ktJbee4tvjbhYbALIxC26hvx07jAQtlQleEN6KyiRFEgVW2fmRJlI4uvqkBeEqXfXcqTwNRCOrM";

            try {
                firebase.initializeApp(firebaseConfig);
                messaging = firebase.messaging();

                // Pedir permiso y obtener el Token
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        console.log("Permiso notificaciones: CONCEDIDO");
                        
                        // Vinculamos Firebase a TU Service Worker existente
                        messaging.getToken({ 
                            vapidKey: VAPID_KEY,
                            serviceWorkerRegistration: registration 
                        }).then((currentToken) => {
                            if (currentToken) {
                                console.log("--- COPIA ESTE TOKEN PARA ENVIAR PRUEBAS ---");
                                console.log(currentToken);
                                console.log("------------------------------------------");
                            } else {
                                console.log('No se pudo generar el token.');
                            }
                        }).catch((err) => {
                            console.warn('Error obteniendo token (Posiblemente necesites HTTPS o Localhost): ', err);
                        });
                    }
                });

                // Escuchar mensajes si la app está abierta
                messaging.onMessage((payload) => {
                    console.log('Mensaje en primer plano:', payload);
                    // Aquí podrías disparar una alerta visual si quieres
                });

            } catch (error) {
                console.error("Error iniciando Firebase:", error);
            }
        }
    </script>

    <script>
        const URL_SERVIDOR = "https://elfaraon65.github.io/bio-breach-repositorio/"; 
        const BYPASS_CORS = "https://corsproxy.io/?"; 
        
        let actualizacionesIgnoradas = new Set(); 

        window.onload = () => {
            actualizarInterfaz();
        };

        // --- LÓGICA DE PESTAÑAS ---
        function switchTab(tabName) {
            // Ocultar todas las vistas
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));

            // Mostrar seleccionada
            document.getElementById(`view-${tabName}`).classList.add('active');
            
            // Activar botón
            const index = tabName === 'library' ? 0 : 1;
            document.querySelectorAll('.tab')[index].classList.add('active');
        }

        function getVersionesLocales() {
            return JSON.parse(localStorage.getItem('bio_breach_v_data')) || {};
        }

        async function cargarRecursoSeguro(url) {
            const urlConTiempo = url + (url.includes('?') ? '&' : '?') + "t=" + new Date().getTime();
            try {
                const res = await fetch(urlConTiempo);
                if (!res.ok) throw new Error("Status: " + res.status);
                return res;
            } catch (e) {
                try {
                    const targetUrl = BYPASS_CORS + encodeURIComponent(urlConTiempo);
                    const resProxy = await fetch(targetUrl);
                    if (!resProxy.ok) throw new Error("Fallo proxy");
                    return resProxy;
                } catch (errorProxy) { throw errorProxy; }
            }
        }

        async function sincroServidor() {
            const statusBar = document.getElementById('status-bar');
            try {
                const res = await cargarRecursoSeguro(URL_SERVIDOR + "versiones.json");
                const nube = await res.json();
                
                statusBar.innerText = "SISTEMA EN LÍNEA";
                statusBar.style.color = "var(--green)";
                
                renderNube(nube);
            } catch (e) {
                console.log("Offline");
                statusBar.innerText = "MODO DESCONECTADO";
                statusBar.style.color = "var(--orange)";
            }
        }

        // LÓGICA SEMÁNTICA (Ignora parches 0.0.X)
        function hayActualizacionImportante(vNube, vLocal) {
            if (!vNube || !vLocal) return false;
            const [M_nube, m_nube] = vNube.split('.').map(n => parseInt(n) || 0);
            const [M_local, m_local] = vLocal.split('.').map(n => parseInt(n) || 0);

            if (M_nube > M_local) return true;
            if (M_nube === M_local && m_nube > m_local) return true;
            return false;
        }

        function renderNube(datosNube) {
            const lista = document.getElementById('lista-versiones');
            const pendingSection = document.getElementById('pending-section');
            const locales = getVersionesLocales();
            
            pendingSection.innerHTML = "";
            let updateCount = 0;

            datosNube.sort((a, b) => {
                const numA = parseInt(a.id.replace(/\D/g, '')) || 0;
                const numB = parseInt(b.id.replace(/\D/g, '')) || 0;
                return numB - numA;
            });

            datosNube.forEach(item => {
                const local = locales[item.id];

                // CASO 1: No instalado
                if (!local) {
                    const card = createCard(item, false, false, true); 
                    pendingSection.appendChild(card);
                } 
                // CASO 2: Instalado -> Revisar Updates
                else {
                    const versionNube = item.version || "1.0.0";
                    const versionLocal = local.version || "0.0.0";
                    
                    const necesitaUpdate = hayActualizacionImportante(versionNube, versionLocal);
                    
                    if (necesitaUpdate) {
                        updateCount++;
                        // A) Poner en "Centro de Datos"
                        const pendingCard = createCard(item, false, true, false);
                        pendingSection.appendChild(pendingCard);

                        // B) Poner Botón en "Biblioteca" (Si no fue ignorado)
                        const localCard = document.getElementById(`card-local-${item.id}`);
                        if (localCard && !actualizacionesIgnoradas.has(item.id)) {
                             if (!localCard.querySelector('.btn-update')) {
                                const btnUpdate = document.createElement('button');
                                btnUpdate.className = 'btn btn-update';
                                btnUpdate.innerText = "ACTUALIZAR DATOS";
                                btnUpdate.onclick = () => descargarEInstalar(item.url, item.id, item.nombre, versionNube, true);
                                
                                const btnPlay = localCard.querySelector('.btn-play');
                                localCard.insertBefore(btnUpdate, btnPlay);
                                
                                const progDiv = document.createElement('div');
                                progDiv.className = 'progress-container';
                                progDiv.id = `prog-cont-local-${item.id}`;
                                progDiv.innerHTML = `<div class="progress-bar" id="prog-bar-local-${item.id}"></div>`;
                                localCard.insertBefore(progDiv, btnUpdate);
                            }
                        }
                    }
                }
            });

            const badge = document.getElementById('update-badge');
            if (updateCount > 0) {
                badge.style.display = 'inline-block';
                badge.innerText = updateCount;
            } else {
                badge.style.display = 'none';
            }

            if (pendingSection.innerHTML === "") {
                pendingSection.innerHTML = `<div class="empty-msg">El sistema está actualizado.</div>`;
            }
        }

        function createCard(item, esLocal, esUpdate, esNuevo) {
            const card = document.createElement('div');
            card.className = 'project-card';
            if (esUpdate) card.style.borderColor = "var(--gold)";
            
            const suffix = esNuevo ? 'new' : 'pending';
            const progId = `prog-cont-${suffix}-${item.id}`;
            const btnId = `btn-${suffix}-${item.id}`;
            
            let htmlStatus = esNuevo ? 'Disponible en Nube' : `<span style="color:var(--gold)">⚠ Actualización v${item.version}</span>`;
            let btnText = esUpdate ? 'ACTUALIZAR DATOS' : 'DESCARGAR';
            let btnClass = esUpdate ? 'btn-update' : 'btn-download';

            card.innerHTML = `
                <div class="v-name">${item.nombre}</div>
                <div class="v-status">${htmlStatus}</div>
                <div class="progress-container" id="${progId}">
                    <div class="progress-bar" id="prog-bar-${suffix}-${item.id}"></div>
                </div>
                <button class="btn ${btnClass}" id="${btnId}" onclick="descargarEInstalar('${item.url}', '${item.id}', '${item.nombre}', '${item.version}', true)">${btnText}</button>
            `;
            return card;
        }

        async function descargarEInstalar(url, id, nombre, versionNube, mostrarProgreso = false) {
            const idsPosibles = [
                { bar: `prog-bar-new-${id}`, cont: `prog-cont-new-${id}`, btn: `btn-new-${id}` }, 
                { bar: `prog-bar-pending-${id}`, cont: `prog-cont-pending-${id}`, btn: `btn-pending-${id}` },
                { bar: `prog-bar-local-${id}`, cont: `prog-cont-local-${id}`, btn: null } 
            ];

            idsPosibles.forEach(ui => {
                const elCont = document.getElementById(ui.cont);
                const elBtn = ui.btn ? document.getElementById(ui.btn) : null;
                if (elCont) elCont.style.display = "block";
                if (elBtn) elBtn.style.display = "none";
            });

            const cardLocal = document.getElementById(`card-local-${id}`);
            const btnUpLocal = cardLocal ? cardLocal.querySelector('.btn-update') : null;
            if(btnUpLocal) btnUpLocal.style.display = "none";

            try {
                const response = await cargarRecursoSeguro(url);
                const codigo = await response.text();
                
                if (mostrarProgreso) {
                    let progreso = 0;
                    const intervalo = setInterval(() => {
                        progreso += 10;
                        idsPosibles.forEach(ui => {
                            const elBar = document.getElementById(ui.bar);
                            if(elBar) elBar.style.width = progreso + "%";
                        });

                        if (progreso >= 100) {
                            clearInterval(intervalo);
                            guardarYActualizar(id, nombre, codigo, versionNube);
                        }
                    }, 50);
                } else {
                    guardarYActualizar(id, nombre, codigo, versionNube);
                }
            } catch (error) { 
                console.error(error);
                alert("Error de conexión.");
                actualizarInterfaz();
            }
        }

        function guardarYActualizar(id, nombre, codigo, version) {
            let locales = getVersionesLocales();
            locales[id] = { nombre: nombre, codigo: codigo, version: version, fecha: new Date().toLocaleString() };
            localStorage.setItem('bio_breach_v_data', JSON.stringify(locales));
            
            if(actualizacionesIgnoradas.has(id)) actualizacionesIgnoradas.delete(id);
            
            actualizarInterfaz();
        }

        function actualizarInterfaz() {
            const lista = document.getElementById('lista-versiones');
            const locales = getVersionesLocales();
            
            const keys = Object.keys(locales).sort((a, b) => {
                const numA = parseInt(a.replace(/\D/g, '')) || 0;
                const numB = parseInt(b.replace(/\D/g, '')) || 0;
                return numB - numA;
            });

            lista.innerHTML = "";
            
            if (keys.length > 0) {
                keys.forEach(id => {
                    const v = locales[id];
                    const card = document.createElement('div');
                    card.className = 'project-card';
                    card.id = `card-local-${id}`;
                    
                    card.innerHTML = `
                        <div class="v-name">${v.nombre}</div>
                        <div class="v-status">
                            <div class="dot active"></div> 
                            Instalado (v${v.version || '?'})
                        </div>
                        <button class="btn btn-play" onclick="lanzarMotor('${id}')">INICIAR</button>
                    `;
                    lista.appendChild(card);
                });
            } else {
                lista.innerHTML = `<div class="empty-msg">Biblioteca vacía. Ve al Centro de Datos.</div>`;
            }
            sincroServidor();
        }

        // --- SISTEMA DE JUEGO & PUENTE DE COMUNICACIÓN ---
        
        function lanzarMotor(id) {
            actualizacionesIgnoradas.add(id);
            
            // Limpieza visual inmediata
            const card = document.getElementById(`card-local-${id}`);
            if(card) {
                const btnUpdate = card.querySelector('.btn-update');
                if(btnUpdate) btnUpdate.remove();
                const progCont = document.getElementById(`prog-cont-local-${id}`);
                if(progCont) progCont.remove();
            }

            const view = document.getElementById('game-view');
            const frame = document.getElementById('game-frame');
            const locales = getVersionesLocales();
            
            if (!locales[id]) return;

            view.style.display = "block";
            
            try {
                const doc = frame.contentDocument || frame.contentWindow.document;
                doc.open();
                doc.write(locales[id].codigo);
                doc.close();
            } catch (e) {
                const blob = new Blob([locales[id].codigo], { type: 'text/html' });
                frame.src = URL.createObjectURL(blob);
            }
        }

        // --- EL PUENTE RESTAURADO (NO BORRAR) ---
        function cerrarMotor() {
            document.getElementById('game-view').style.display = "none";
            document.getElementById('game-frame').src = "about:blank"; // Mata el proceso del juego
        }

        // Escucha la señal del juego (postMessage)
        window.addEventListener('message', (event) => {
            // Aceptamos 'closeGame' o cualquier variante que uses
            if (event.data === 'closeGame' || event.data === 'EXIT_SYSTEM') {
                console.log("Señal de salida recibida del núcleo.");
                cerrarMotor();
            }
        });
        
        window.addEventListener('online', actualizarInterfaz);
        window.addEventListener('offline', actualizarInterfaz);
    </script>
</body>
</html>
