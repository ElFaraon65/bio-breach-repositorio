    <style>        
        :root { 
            --gold: #d6b066; --bg: #0a0a0a; --card: #161616; 
            --blue: #4a6fa5; --green: #2e8b57; --orange: #c17817; --red: #8b1a1a; --tab-active: #1c1810;
            --font-display: 'Oswald', 'Impact', 'Arial Narrow Bold', sans-serif;
            --font-mono: 'Special Elite', 'Courier New', Courier, monospace;
        }
        
        html { height: 100%; overscroll-behavior: none; }
        body { 
            background-color: var(--bg);
            /* mismo grano de película sutil que el resto de BIO-BREACH */
            background-image: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(255,255,255,0.025) 1px, rgba(255,255,255,0.025) 2px);
            color: #ddd; font-family: var(--font-mono);
            margin: 0; padding: 0; user-select: none; min-height: 100%;
            overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; 
        }
        
        .header { 
            background: #000; padding: 13px 15px; text-align: center; border-bottom: 1px solid #3a3020; 
            position: sticky; top: 0; z-index: 10; 
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .header-badge { width: 28px; height: 28px; flex-shrink: 0; filter: drop-shadow(0 0 3px rgba(214,176,102,0.35)); }
        .header-text { text-align: left; }
        .header h1 { 
            margin: 0; font-size: 1.1rem; color: var(--gold); letter-spacing: 3px; text-transform: uppercase; 
            font-family: var(--font-display); font-weight: 600; text-shadow: 2px 2px 0 #000;
        }
        #status-bar { font-size: 0.62rem; color: var(--orange); text-transform: uppercase; margin-top: 3px; letter-spacing: 1.5px; }

        /* --- SISTEMA DE PESTAÑAS --- */
        .tabs { display: flex; background: #111; border-bottom: 2px solid var(--gold); position: sticky; top: 57px; z-index: 9; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .tab { 
            flex: 1; padding: 14px 8px; text-align: center; font-weight: bold; font-size: 0.78rem; color: #777; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; position: relative; 
            font-family: var(--font-display);
        }
        .tab.active { color: #f0e0c0; background: var(--tab-active); }
        .tab.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--gold); }
        
        .badge { 
            background: var(--red); color: #f0e0c0; font-size: 0.68rem; padding: 2px 6px; border-radius: 10px; 
            border: 1px solid #3a0a0a; position: absolute; top: 8px; right: 8px; display: none; 
            animation: pulse 2s infinite; font-family: var(--font-mono);
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }

        /* Contenedores de Vistas */
        .view-section { display: none; padding: 15px; padding-bottom: 100px; animation: fadeIn 0.3s; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .project-card { 
            background: var(--card); border-radius: 3px; padding: 18px; margin-bottom: 15px; 
            border: 1px solid #332d20; box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 12px; transition: 0.2s; position: relative; 
        }
        
        .v-name { font-size: 1.1rem; font-weight: 600; color: #f0e0c0; font-family: var(--font-display); letter-spacing: 1px; text-transform: uppercase; }
        .v-status { font-size: 0.78rem; color: #999; display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; flex-shrink: 0; }
        .dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .dot.offline { background: var(--orange); }

        .progress-container { width: 100%; background: #2a2a2a; height: 10px; border-radius: 2px; overflow: hidden; display: none; margin-top: 10px; border: 1px solid #000; }
        .progress-bar { width: 0%; height: 100%; background: var(--blue); transition: width 0.1s; }

        .btn { 
            border: 1px solid rgba(0,0,0,0.4); padding: 13px; border-radius: 2px; font-weight: bold; font-size: 0.92rem; 
            cursor: pointer; text-align: center; transition: 0.15s; margin-top: 5px; color: #111; width: 100%; 
            font-family: var(--font-display); letter-spacing: 1.5px; text-transform: uppercase;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
        }
        .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px rgba(0,0,0,0.5); }
        .btn-play { background: var(--green); color: #fff; }
        .btn-download { background: var(--blue); color: #fff; }
        
        .btn-update { background: transparent; border: 2px solid var(--gold); color: var(--gold); margin-top: 5px; box-shadow: none; }
        .btn-update:active { background: var(--gold); color: black; transform: none; }

        .empty-msg { text-align: center; padding: 40px 20px; color: #666; font-size: 0.85rem; border: 1px dashed #3a3020; border-radius: 3px; margin-top: 20px; font-family: var(--font-mono); }

        #game-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; overscroll-behavior: none; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>

                        <script>
        // --- GESTIÓN DE PWA: MODO AHORRO & SEÑAL ---
        
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); });

        function getVersionMasAlta() {
            const locales = JSON.parse(localStorage.getItem('bio_breach_v_data')) || {};
            const keys = Object.keys(locales).sort((a, b) => {
                const numA = parseInt(a.replace(/\D/g, '')) || 0;
                const numB = parseInt(b.replace(/\D/g, '')) || 0;
                return numB - numA;
            });
            return keys.length > 0 ? (locales[keys[0]].version || "0.0.0") : "0.0.0";
        }

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js?v=" + new Date().getTime(), { scope: "./" })
                .then(async reg => {
                    console.log("SW: Conectado (Modo Espera de Señal).");

                    if ('Notification' in window && Notification.permission === 'default') {
                        await Notification.requestPermission();
                    }

                    // REGISTRO DE TAREA PERIÓDICA (Chequeo de fondo a largo plazo)
                    if ('periodicSync' in reg) {
                        try {
                            const status = await navigator.permissions.query({ name: 'periodic-background-sync' });
                            if (status.state === 'granted') {
                                await reg.periodicSync.register('smart-system-check', {
                                    minInterval: 4 * 60 * 60 * 1000 // Intento cada 4h (aprox)
                                });
                            }
                        } catch (e) { console.log("Sync periódico no soportado."); }
                    }

                    // AL ENTRAR: Limpiamos estado y alertas
                    if (reg.active) {
                        reg.active.postMessage({ 
                            type: 'CLEAR_EXIT_TIME', 
                            version: getVersionMasAlta() 
                        });
                    }
                })
                .catch(err => console.error("SW Error:", err));

            // DETECTOR DE SALIDA / ENTRADA
            document.addEventListener("visibilitychange", () => {
                if (!navigator.serviceWorker.controller) return;
                const vActual = getVersionMasAlta();

                if (document.hidden) {
                    // AL SALIR:
                    // 1. "SW, guarda la hora pero no hagas nada todavía"
                    navigator.serviceWorker.controller.postMessage({ 
                        type: 'SAVE_EXIT_TIME',
                        version: vActual
                    });

                    // 2. "Navegador, cuando tengas red y batería, revisa si ya pasaron 4h"
                    navigator.serviceWorker.ready.then(reg => {
                        if ('sync' in reg) {
                            reg.sync.register('sync-check-now').catch(() => {});
                        }
                    });

                } else {
                    // AL VOLVER:
                    navigator.serviceWorker.controller.postMessage({ 
                        type: 'CLEAR_EXIT_TIME',
                        version: vActual
                    });
                }
            });
        }        
    </script>

    <script>
        const URL_SERVIDOR = "https://elfaraon65.github.io/bio-breach-repositorio/"; 
        const BYPASS_CORS = "https://corsproxy.io/?"; 
        
        let actualizacionesIgnoradas = new Set(); 
        let blobUrlActivo = null; // URL del motor cargado actualmente, para poder liberarla al cerrar

        window.onload = () => {
            actualizarInterfaz();
        };

        // --- LÓGICA DE PESTAÑAS ---
        function switchTab(tabName) {
            // Ocultar todas las vistas
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));

            // Mostrar seleccionada
            document.getElementById(`view-${tabName}`).classList.add('active');
            
            // Activar botón
            const index = tabName === 'library' ? 0 : 1;
            document.querySelectorAll('.tab')[index].classList.add('active');
        }

        function getVersionesLocales() {
            return JSON.parse(localStorage.getItem('bio_breach_v_data')) || {};
        }

        async function cargarRecursoSeguro(url) {
            const urlConTiempo = url + (url.includes('?') ? '&' : '?') + "t=" + new Date().getTime();
            try {
                const res = await fetch(urlConTiempo);
                if (!res.ok) throw new Error("Status: " + res.status);
                return res;
            } catch (e) {
                try {
                    const targetUrl = BYPASS_CORS + encodeURIComponent(urlConTiempo);
                    const resProxy = await fetch(targetUrl);
                    if (!resProxy.ok) throw new Error("Fallo proxy");
                    return resProxy;
                } catch (errorProxy) { throw errorProxy; }
            }
        }

        async function sincroServidor() {
            const statusBar = document.getElementById('status-bar');
            try {
                const res = await cargarRecursoSeguro(URL_SERVIDOR + "versiones.json");
                const nube = await res.json();
                
                statusBar.innerText = "SISTEMA EN LÍNEA";
                statusBar.style.color = "var(--green)";
                
                renderNube(nube);
            } catch (e) {
                console.log("Offline");
                statusBar.innerText = "MODO DESCONECTADO";
                statusBar.style.color = "var(--orange)";
            }
        }

        // LÓGICA SEMÁNTICA (Major y Minor activan UI, Patch es silencioso)
        function hayActualizacionImportante(vNube, vLocal) {
            if (!vNube || !vLocal) return false;
            const [M_nube, m_nube] = vNube.split('.').map(n => parseInt(n) || 0);
            const [M_local, m_local] = vLocal.split('.').map(n => parseInt(n) || 0);

            if (M_nube > M_local) return true;
            if (M_nube === M_local && m_nube > m_local) return true;
            return false;
        }

        function renderNube(datosNube) {
            const lista = document.getElementById('lista-versiones');
            const pendingSection = document.getElementById('pending-section');
            const locales = getVersionesLocales();
            
            pendingSection.innerHTML = "";
            let updateCount = 0;

            datosNube.sort((a, b) => {
                const numA = parseInt(a.id.replace(/\D/g, '')) || 0;
                const numB = parseInt(b.id.replace(/\D/g, '')) || 0;
                return numB - numA;
            });

            datosNube.forEach(item => {
                const local = locales[item.id];

                // CASO 1: No instalado
                if (!local) {
                    const card = createCard(item, false, false, true); 
                    pendingSection.appendChild(card);
                } 
                // CASO 2: Instalado -> Revisar Updates
                else {
                    const versionNube = item.version || "1.0.0";
                    const versionLocal = local.version || "0.0.0";
                    
                    const necesitaUpdate = hayActualizacionImportante(versionNube, versionLocal);
                    
                    if (necesitaUpdate) {
                        // ACTUALIZACIÓN MAYOR O MENOR (REQUIERE ACCIÓN)
                        updateCount++;
                        // A) Poner en "Centro de Datos"
                        const pendingCard = createCard(item, false, true, false);
                        pendingSection.appendChild(pendingCard);

                        // B) Poner Botón en "Biblioteca" (Si no fue ignorado)
                        const localCard = document.getElementById(`card-local-${item.id}`);
                        if (localCard && !actualizacionesIgnoradas.has(item.id)) {
                             if (!localCard.querySelector('.btn-update')) {
                                const btnUpdate = document.createElement('button');
                                btnUpdate.className = 'btn btn-update';
                                btnUpdate.innerText = "ACTUALIZAR DATOS";
                                btnUpdate.onclick = () => descargarEInstalar(item.url, item.id, item.nombre, versionNube, true);
                                
                                const btnPlay = localCard.querySelector('.btn-play');
                                localCard.insertBefore(btnUpdate, btnPlay);
                                
                                const progDiv = document.createElement('div');
                                progDiv.className = 'progress-container';
                                progDiv.id = `prog-cont-local-${item.id}`;
                                progDiv.innerHTML = `<div class="progress-bar" id="prog-bar-local-${item.id}"></div>`;
                                localCard.insertBefore(progDiv, btnUpdate);
                            }
                        }
                    } else if (versionNube !== versionLocal) {
                        // PARCHE SILENCIOSO (Cambio menor, ej: 7.1.0 -> 7.1.1)
                        // No mostramos nada, actualizamos en segundo plano
                        console.log(`Aplicando parche silencioso para ${item.nombre}: v${versionNube}`);
                        descargarEInstalar(item.url, item.id, item.nombre, versionNube, false);
                    }
                }
            });

            const badge = document.getElementById('update-badge');
            if (updateCount > 0) {
                badge.style.display = 'inline-block';
                badge.innerText = updateCount;
            } else {
                badge.style.display = 'none';
            }

            if (pendingSection.innerHTML === "") {
                pendingSection.innerHTML = `<div class="empty-msg">El sistema está actualizado.</div>`;
            }
        }

        function createCard(item, esLocal, esUpdate, esNuevo) {
            const card = document.createElement('div');
            card.className = 'project-card';
            if (esUpdate) card.style.borderColor = "var(--gold)";
            
            const suffix = esNuevo ? 'new' : 'pending';
            const progId = `prog-cont-${suffix}-${item.id}`;
            const btnId = `btn-${suffix}-${item.id}`;
            
            let htmlStatus = esNuevo ? 'Disponible en Nube' : `<span style="color:var(--gold)">⚠ Actualización v${item.version}</span>`;
            let btnText = esUpdate ? 'ACTUALIZAR DATOS' : 'DESCARGAR';
            let btnClass = esUpdate ? 'btn-update' : 'btn-download';

            card.innerHTML = `
                <div class="v-name">${item.nombre}</div>
                <div class="v-status">${htmlStatus}</div>
                <div class="progress-container" id="${progId}">
                    <div class="progress-bar" id="prog-bar-${suffix}-${item.id}"></div>
                </div>
                <button class="btn ${btnClass}" id="${btnId}" onclick="descargarEInstalar('${item.url}', '${item.id}', '${item.nombre}', '${item.version}', true)">${btnText}</button>
            `;
            return card;
        }

        async function descargarEInstalar(url, id, nombre, versionNube, mostrarProgreso = false) {
            const idsPosibles = [
                { bar: `prog-bar-new-${id}`, cont: `prog-cont-new-${id}`, btn: `btn-new-${id}` }, 
                { bar: `prog-bar-pending-${id}`, cont: `prog-cont-pending-${id}`, btn: `btn-pending-${id}` },
                { bar: `prog-bar-local-${id}`, cont: `prog-cont-local-${id}`, btn: null } 
            ];

            // Solo alteramos la UI si NO es una actualización silenciosa
            if (mostrarProgreso) {
                idsPosibles.forEach(ui => {
                    const elCont = document.getElementById(ui.cont);
                    const elBtn = ui.btn ? document.getElementById(ui.btn) : null;
                    if (elCont) elCont.style.display = "block";
                    if (elBtn) elBtn.style.display = "none";
                });

                const cardLocal = document.getElementById(`card-local-${id}`);
                const btnUpLocal = cardLocal ? cardLocal.querySelector('.btn-update') : null;
                if(btnUpLocal) btnUpLocal.style.display = "none";
            }

            try {
                const response = await cargarRecursoSeguro(url);
                const codigo = await response.text();
                
                if (mostrarProgreso) {
                    let progreso = 0;
                    const intervalo = setInterval(() => {
                        progreso += 10;
                        idsPosibles.forEach(ui => {
                            const elBar = document.getElementById(ui.bar);
                            if(elBar) elBar.style.width = progreso + "%";
                        });

                        if (progreso >= 100) {
                            clearInterval(intervalo);
                            guardarYActualizar(id, nombre, codigo, versionNube);
                        }
                    }, 50);
                } else {
                    // Actualización directa sin barra de carga (Silent Patch)
                    guardarYActualizar(id, nombre, codigo, versionNube);
                }
            } catch (error) { 
                console.error(error);
                if (mostrarProgreso) {
                    alert("Error de conexión.");
                    actualizarInterfaz();
                }
            }
        }

        function guardarYActualizar(id, nombre, codigo, version) {
            let locales = getVersionesLocales();
            locales[id] = { nombre: nombre, codigo: codigo, version: version, fecha: new Date().toLocaleString() };
            try {
                localStorage.setItem('bio_breach_v_data', JSON.stringify(locales));
            } catch (e) {
                console.error('No se pudo guardar en almacenamiento local:', e);
                alert('ALMACENAMIENTO LLENO: no se pudo guardar esta versión. Borra alguna versión vieja que ya no uses y vuelve a intentarlo.');
                return;
            }
            
            if(actualizacionesIgnoradas.has(id)) actualizacionesIgnoradas.delete(id);
            
            actualizarInterfaz();
        }

        function actualizarInterfaz() {
            const lista = document.getElementById('lista-versiones');
            const locales = getVersionesLocales();
            
            const keys = Object.keys(locales).sort((a, b) => {
                const numA = parseInt(a.replace(/\D/g, '')) || 0;
                const numB = parseInt(b.replace(/\D/g, '')) || 0;
                return numB - numA;
            });

            lista.innerHTML = "";
            
            if (keys.length > 0) {
                keys.forEach(id => {
                    const v = locales[id];
                    const card = document.createElement('div');
                    card.className = 'project-card';
                    card.id = `card-local-${id}`;
                    
                    // Aquí se muestra la versión actualizada (vX.X.X) gracias al parche silencioso
                    card.innerHTML = `
                        <div class="v-name">${v.nombre}</div>
                        <div class="v-status">
                            <div class="dot active"></div> 
                            Instalado (v${v.version || '?'})
                        </div>
                        <button class="btn btn-play" onclick="lanzarMotor('${id}')">INICIAR</button>
                    `;
                    lista.appendChild(card);
                });
            } else {
                lista.innerHTML = `<div class="empty-msg">Biblioteca vacía. Ve al Centro de Datos.</div>`;
            }
            sincroServidor();
        }

        // --- SISTEMA DE JUEGO & PUENTE DE COMUNICACIÓN ---
        
        function lanzarMotor(id) {
            actualizacionesIgnoradas.add(id);
            
            // Limpieza visual inmediata
            const card = document.getElementById(`card-local-${id}`);
            if(card) {
                const btnUpdate = card.querySelector('.btn-update');
                if(btnUpdate) btnUpdate.remove();
                const progCont = document.getElementById(`prog-cont-local-${id}`);
                if(progCont) progCont.remove();
            }

            const view = document.getElementById('game-view');
            const frame = document.getElementById('game-frame');
            const locales = getVersionesLocales();
            
            if (!locales[id]) return;

            view.style.display = "block";
            
            // --- MOTOR DE CARGA (V6.1) ---
            // srcdoc parecía la solución, pero el control del Service Worker sobre un
            // iframe srcdoc es un comportamiento INCONSISTENTE entre navegadores (Chrome
            // llegó a revertirlo por bugs propios; Edge tiene una política dedicada solo
            // para esto). Cuando el navegador SÍ extiende ese control, sw.js intercepta
            // hasta los pedidos que hace el propio juego (PeerJS, fuentes) y, si alguno
            // falla bajo esa intercepción, el motor puede quedar a medio inicializar:
            // exactamente el patrón de "la cinta nunca conecta" + lag constante.
            // Un blob: SÍ tiene una garantía consistente: por spec, un Service Worker
            // nunca puede interceptar una URL blob:, así que esto saca al juego por
            // completo de esa zona gris, en cualquier navegador.
            try {
                if (blobUrlActivo) { URL.revokeObjectURL(blobUrlActivo); blobUrlActivo = null; }
                const blob = new Blob([locales[id].codigo], { type: 'text/html' });
                blobUrlActivo = URL.createObjectURL(blob);
                frame.removeAttribute('srcdoc');
                frame.src = blobUrlActivo;
            } catch (e) {
                console.error('No se pudo iniciar el motor:', e);
                alert('No se pudo iniciar el juego. Intenta descargarlo de nuevo desde CENTRO DE DATOS.');
            }
        }

        // --- EL PUENTE RESTAURADO (NO BORRAR) ---
        function cerrarMotor() {
            document.getElementById('game-view').style.display = "none";
            document.getElementById('game-frame').src = "about:blank"; // Mata el proceso del juego
            if (blobUrlActivo) { URL.revokeObjectURL(blobUrlActivo); blobUrlActivo = null; }
        }

        // Escucha la señal del juego (postMessage)
        window.addEventListener('message', (event) => {
            // Aceptamos 'closeGame' o cualquier variante que uses
            if (event.data === 'closeGame' || event.data === 'EXIT_SYSTEM') {
                console.log("Señal de salida recibida del núcleo.");
                cerrarMotor();
            }
        });
        
        window.addEventListener('online', actualizarInterfaz);
        window.addEventListener('offline', actualizarInterfaz);
    </script>
</body>
</html>
